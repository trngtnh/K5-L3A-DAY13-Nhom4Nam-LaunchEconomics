    spillover_risk: "Nhân viên hai nhóm có thể chia sẻ câu trả lời hoặc quy trình. Giảm thiểu bằng phân quyền theo tài khoản và ghi log theo staff_id."
    predeclared: "Khóa chỉ số chính, MDE, ngưỡng dừng, quy tắc rollback và ngày ra quyết định trước khi pilot bắt đầu."
