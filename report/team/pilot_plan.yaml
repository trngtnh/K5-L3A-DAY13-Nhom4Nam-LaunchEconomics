    - "NẾU chi phi moi viec thanh cong cua pilot vuot 12.000 VND trong 2 tuan lien tiep THI tam dung mo rong va thu hep pham vi ve noi_dia; KHONG THI tiep tuc theo doi truoc khi mo rong."
    - "NẾU tỷ lệ nhân viên bỏ qua đề xuất của trợ lý vượt 40% trong 1 tuần THÌ Trưởng nhóm CS phỏng vấn 5 nhân viên trong 3 ngày và tạm dừng tăng rollout; KHÔNG THÌ tiếp tục theo dõi."
