  rollback: "Giám đốc vận hành kích hoạt kill switch trong tối đa 30 phút; các yêu cầu được chuyển về quy trình xử lý thủ công của nhân viên." # ai bấm, mất bao lâu, khách được phục vụ bằng gì
  decision_date: "2026-11-21"
  simulated_inputs: ["baseline=0.70", "MDE=0.06", "alpha=0.05", "power=0.80", "ICC=0.02", "reopen_rate=4.25% (du lieu mo phong)", "requests_per_staff=299"]         # liệt kê mọi con số giả lập đã dùng

# ============================================================
# D1 - TINH CO MAU VA LUA CHON PHUONG AN PHAN NHOM PILOT
# ============================================================
#
# Nhóm lựa chọn phân nhóm theo nhân viên (staff-level randomization):
# 20 nhân viên thuộc nhóm thử nghiệm (treatment) và 20 nhân viên
# thuộc nhóm đối chứng (control). Hai nhóm được triển khai đồng thời.
#
# D1a - Nếu phân nhóm ngẫu nhiên theo từng yêu cầu (request-level),
# cần 1.251 yêu cầu cho mỗi nhóm để phát hiện mức cải thiện 5 điểm
# phần trăm, với tỷ lệ thành công ban đầu 70%, mức ý nghĩa 5% và
# statistical power 80%.
#
# D1b - Nếu phân nhóm theo nhân viên, với trung bình 75 yêu cầu
# mỗi nhân viên, design effect = 2,48. Do đó cần khoảng 3.103
# yêu cầu cho mỗi nhóm.
#
# D1c - Với 20 nhân viên mỗi nhóm và ICC = 0,02, cỡ mẫu hiệu dụng
# tối đa là 20 / 0,02 = 1.000. Vì vậy, nguồn lực hiện có không
# đủ để đảm bảo phát hiện mức cải thiện 5 điểm phần trăm theo
# thiết kế ban đầu.
#
# D1d - Nếu phân nhóm theo depot, mỗi nhóm có 6 depot. Cỡ mẫu
# hiệu dụng tối đa chỉ là 6 / 0,02 = 300. Phương án này không
# đáp ứng yêu cầu cỡ mẫu và có quá ít cụm.
#
# D1e - Nhóm chuyển sang thiết kế với MDE = 6 điểm phần trăm,
# tức tỷ lệ thành công tăng từ 70% lên 76%. Cần 859 yêu cầu
# hiệu dụng cho mỗi nhóm. Với 20 nhân viên mỗi nhóm, mỗi nhân viên
# cần xử lý tối thiểu 299 yêu cầu. Design effect = 6,96 và cỡ mẫu
# hiệu dụng đạt khoảng 859,20 mỗi nhóm.
#
# KIEM TRA DO NHAY:
# Nếu hiệu quả thực tế chỉ tăng 5 điểm phần trăm (70% lên 75%),
# statistical power của thiết kế 859 yêu cầu mỗi nhóm chỉ đạt
# 64,17%, thấp hơn mục tiêu 80%.
#
# KET LUAN:
# Nhóm chọn phân nhóm theo nhân viên vì có thể bố trí đủ 20 cụm
# mỗi nhóm và hạn chế việc một nhân viên sử dụng đồng thời cả
# phương án thử nghiệm lẫn đối chứng. Nhóm chấp nhận MDE 6 điểm
# phần trăm như một sự đánh đổi theo nguồn lực hiện có.
# Không lựa chọn phân nhóm theo depot vì chỉ có 6 depot mỗi nhóm,
# cỡ mẫu hiệu dụng tối đa 300.

# ============================================================
# D2 - DAM BAO KHA NANG NHAN DIEN TAC DONG CUA PILOT
# ============================================================
#
# 1. Nhom thu nghiem va nhom doi chung duoc trien khai dong thoi
# trong cung giai doan va cung dieu kien van hanh.
#
# 2. Phan nhom ngau nhien theo staff_id, co ghi lai random seed
# va phan tang theo depot de tranh mat can bang giua cac nhom.
#
# 3. Rui ro spillover: nhan vien hai nhom co the chia se cau tra loi
# hoac quy trinh xu ly. Bien phap giam thieu: phan quyen truy cap
# theo tai khoan, ghi log staff_id va theo doi viec mo tro ly.
#
# 4. Truoc khi pilot bat dau, khoa primary metric, MDE, nguong
# dung, quy tac rollback va ngay ra quyet dinh. Khong thay doi
# tieu chi sau khi da xem ket qua.
#
# 5. Thiet ke co 20 nhan vien moi nhom, dap ung yeu cau toi thieu
# 20 clusters/group. Khong phan nhom theo depot vi chi co 6 depot
# moi nhom.
#
